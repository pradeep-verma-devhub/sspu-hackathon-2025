<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Portal</title>
    <link href="../login.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <h1 class="portal-title">🎓 Login Page</h1>
            <p class="portal-subtitle">Enter your credentials to access your personalized portal.</p>
            <div id="error-message" class="error-container"></div>
            
            <form id="initial-form" action="/login" method="POST">
                <input type="email" id="studentEmail" name="studentEmail" placeholder="Student Gmail" required>
                <input type="password" id="studentPassword" name="studentPassword" placeholder="Password" required>
                <button type="submit" class="submit-btn">Proceed to Dashboard</button>
            </form>
            </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('error') === 'invalid_credentials') {
            const errorDiv = document.getElementById('error-message');
            if (errorDiv) {
                errorDiv.textContent = '❌ Invalid Gmail or Password.';
                errorDiv.style.display = 'flex';
            }
        }
    </script>
    </body>

    <style>
        body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #1f2833, #0a111a);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    color: #f5f5f5;
}

.login-card {
    background: #1a222c;
    padding: 40px;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    width: 350px;
    text-align: center;
    animation: fadeIn 1s ease-out;
      transition: all 0.3s ease;
}


.login-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 0 25px rgba(0, 255, 255, 0.2);
}



.portal-title {
    font-weight: 700;
    color: #66fcf1;
    margin-bottom: 5px;
}

.portal-subtitle {
    color: #c5c6c7;
    margin-bottom: 30px;
    font-weight: 300;
}

input[type="email"],
input[type="password"] {
    width: 100%;
    padding: 12px;
    margin-bottom: 20px;
    border: 1px solid #45a29e;
    border-radius: 6px;
    background: #27303d;
    color: #f5f5f5;
    box-sizing: border-box;
    transition: all 0.3s ease;
}

input:focus {
    outline: none;
    border-color: #66fcf1;
    box-shadow: 0 0 8px rgba(102, 252, 241, 0.4);
}

.submit-btn {
    width: 100%;
    padding: 14px;
    background: #45a29e;
    color: white;
    border: none;
    border-radius: 6px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.3s ease, transform 0.1s ease;
}

.submit-btn:hover {
    background: #66fcf1;
    color: #1a222c;
}

.submit-btn:active {
    transform: scale(0.98);
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(20px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.error-container {
    background: rgba(255, 107, 107, 0.15);
    border: 1px solid #ff6b6b;
    color: #ff8b8b;
    padding: 12px 15px;
    border-radius: 8px;
    margin-bottom: 20px;
    font-size: 0.9rem;
    display: none;
    align-items: center;
    justify-content: center;
    gap: 8px;
    box-shadow: 0 4px 15px rgba(255, 107, 107, 0.2);
    animation: shake 0.5s ease-in-out;
}

@keyframes shake {
    0%, 100% { transform: translateX(0); }
    20%, 60% { transform: translateX(-6px); }
    40%, 80% { transform: translateX(6px); }
}
    </style>
</html>
